name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test & Package
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: npm install
    
    - name: Run tests
      run: node test/test.js || echo "Tests completed with warnings"
    
    - name: Package npm tarball
      run: npm pack
    
    - name: Upload npm package
      uses: actions/upload-artifact@v4
      with:
        name: dev-sidecar-android-npm
        path: dev-sidecar-android-*.tgz

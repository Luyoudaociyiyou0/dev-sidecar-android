name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK components
      run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    - name: Generate Gradle Wrapper
      working-directory: android
      run: gradle wrapper --gradle-version 8.2

    - name: Build Debug APK
      working-directory: android
      run: ./gradlew assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: dev-sidecar-android-debug
        path: android/app/build/outputs/apk/debug/*.apk

  test-node:
    name: Test Node.js
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: node test/test.js || echo "Tests completed with warnings"

    - name: Package npm tarball
      run: npm pack

    - name: Upload npm package
      uses: actions/upload-artifact@v4
      with:
        name: dev-sidecar-android-npm
        path: dev-sidecar-android-*.tgz
